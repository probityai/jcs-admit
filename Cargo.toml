[package]
name = "agent-evidence-admission"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Admission control for JSON about to be signed: refuses duplicate object members, nesting past a depth cap, non-scalar strings and unsafe integers on the raw bytes, then delegates RFC 8785 canonicalization to serde_json_canonicalizer"
documentation = "https://docs.rs/agent-evidence-admission"
readme = "README.md"
keywords = ["jcs", "rfc8785", "canonicalization", "attestation", "in-toto"]
categories = ["encoding", "cryptography", "parser-implementations"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/astrogilda/agent-evidence-admission-rs"
exclude = ["/.github", "/docs"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json_canonicalizer = "0.3.2"

[dev-dependencies]
# The differential test needs to reach the delegate's own entry points and to
# build a value its parser never saw, so it needs both crates directly.
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
